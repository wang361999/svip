name: Update macro data

# 自动拉取美联储 FRED 宏观数据 → 提交到仓库 → Vercel 自动部署
# 背景：FRED（Akamai CDN）在网络层丢弃 Vercel 出口 IP 的连接，
#       GitHub Actions runner（Azure IP）可正常访问，故用定时任务中转
#
# 调度策略：
# - 工作日每 30 分钟跑一次（覆盖美东 8:30 数据发布窗口）
# - 每天凌晨全量刷新
on:
  schedule:
    # 工作日每 30 分钟（12:00-21:30 UTC = 美东 8:00-17:30），覆盖非农/CPI/PCE/初请发布窗口
    - cron: '0,30 12-21 * * 1-5'
    # 周末每天一次（12:30 UTC），保持数据新鲜
    - cron: '30 12 * * 6,0'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

concurrency:
  group: macro-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch FRED data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node scripts/update-macro.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/macro-live.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): 自动更新宏观数据（FRED）"
            git push
          fi
